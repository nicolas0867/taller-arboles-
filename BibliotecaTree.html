<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BibliotecaTree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f2f4f1;--surface:#fff;--ink:#1d2b27;--muted:#5d6b66;--line:#d5dbd6;--green:#1f4a3e;--brass:#a67c1f;--hit:#a67c1f;--onGreen:#fff;--err:#a3321f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--surface:#1b2622;--ink:#e8eee9;--muted:#9babA5;--line:#32423c;--green:#6fb89f;--brass:#e0b655;--hit:#e0b655;--onGreen:#102019;--err:#ff8c78;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Literata,Georgia,serif;font-size:2.2rem;margin:0;color:var(--green);letter-spacing:-.01em}
.sub{margin:4px 0 22px;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-family:Literata,Georgia,serif;font-size:1.1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:120px 1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--green);background:transparent;color:var(--green)}
button.main{background:var(--green);color:var(--onGreen)}
button:hover{filter:brightness(1.1)}
.status{margin:12px 0 0;font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--err)}
.scroll{overflow-x:auto}
svg{display:block;margin:0 auto;max-width:none}
.edge{stroke:var(--line);stroke-width:2;fill:none}
.edge.on{stroke:var(--hit);stroke-width:3}
.node circle{fill:var(--surface);stroke:var(--green);stroke-width:2}
.node.on circle{fill:var(--hit);stroke:var(--hit)}
.node text{font:600 13px Figtree,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.node.on text{fill:#fff}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td:first-child,th:first-child{width:90px;font-variant-numeric:tabular-nums}
tr.on td{background:color-mix(in srgb,var(--hit) 22%,transparent)}
.empty{color:var(--muted);padding:12px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:1.8rem}}
</style>
</head>
<body>
<main>
<h1>BibliotecaTree</h1>
<p class="sub">Gestión de libros con un árbol binario de búsqueda ordenado por código.</p>

<section>
<h2>Datos del libro</h2>
<div class="grid">
<label>Código<input id="cod" inputmode="numeric" autocomplete="off"></label>
<label>Título<input id="tit" autocomplete="off"></label>
<label>Autor<input id="aut" autocomplete="off"></label>
</div>
<div class="btns">
<button class="main" id="bAdd">Agregar libro</button>
<button id="bFind">Buscar por código</button>
<button id="bDel">Eliminar libro</button>
<button id="bClr">Limpiar</button>
<button id="bAll">Mostrar todos</button>
</div>
<p class="status" id="st" role="status"></p>
</section>

<section>
<h2>Estructura del árbol</h2>
<div class="scroll" id="treeBox"></div>
</section>

<section>
<h2>Libros registrados (recorrido inorden)</h2>
<div class="scroll"><table><thead><tr><th>Código</th><th>Título</th><th>Autor</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="empty" id="empty" hidden>No hay libros. Agrega el primero con el formulario.</div>
</section>
</main>

<script>
class Nodo{constructor(c,t,a){this.codigo=c;this.titulo=t;this.autor=a;this.izq=null;this.der=null}}
class ABB{
  constructor(){this.raiz=null}
  insertar(c,t,a){
    const n=new Nodo(c,t,a);
    if(!this.raiz){this.raiz=n;return true}
    let x=this.raiz;
    for(;;){
      if(c===x.codigo)return false;
      const lado=c<x.codigo?'izq':'der';
      if(!x[lado]){x[lado]=n;return true}
      x=x[lado];
    }
  }
  buscar(c){
    const ruta=[];let x=this.raiz;
    while(x){ruta.push(x.codigo);if(c===x.codigo)return{nodo:x,ruta};x=c<x.codigo?x.izq:x.der}
    return{nodo:null,ruta};
  }
  _min(n){while(n.izq)n=n.izq;return n}
  _elim(n,c){
    if(!n)return[null,false];
    let ok;
    if(c<n.codigo){[n.izq,ok]=this._elim(n.izq,c);return[n,ok]}
    if(c>n.codigo){[n.der,ok]=this._elim(n.der,c);return[n,ok]}
    if(!n.izq)return[n.der,true];
    if(!n.der)return[n.izq,true];
    const s=this._min(n.der);
    n.codigo=s.codigo;n.titulo=s.titulo;n.autor=s.autor;
    [n.der]=this._elim(n.der,s.codigo);
    return[n,true];
  }
  eliminar(c){let ok;[this.raiz,ok]=this._elim(this.raiz,c);return ok}
  inorden(){
    const r=[];
    const f=n=>{if(n){f(n.izq);r.push(n);f(n.der)}};
    f(this.raiz);return r;
  }
}

const $=id=>document.getElementById(id);
const arbol=new ABB();
[[50,"Cien años de soledad","Gabriel García Márquez"],[30,"El principito","Antoine de Saint-Exupéry"],
 [70,"Don Quijote de la Mancha","Miguel de Cervantes"],[20,"La ciudad y los perros","Mario Vargas Llosa"],
 [40,"Crónica de una muerte anunciada","Gabriel García Márquez"],[60,"La odisea","Homero"],
 [80,"Romeo y Julieta","William Shakespeare"]].forEach(l=>arbol.insertar(...l));

let resaltados=new Set();

function msg(t,err){const s=$('st');s.textContent=t;s.className='status'+(err?' err':'')}

function leerCodigo(){
  const v=$('cod').value.trim();
  if(!v){msg('Ingresa el código del libro.',true);return null}
  if(!/^-?\d+$/.test(v)){msg('El código debe ser un número entero.',true);return null}
  return parseInt(v,10);
}

function dibujar(){
  // tabla
  const lista=arbol.inorden(),tb=$('rows');
  tb.innerHTML='';
  lista.forEach(n=>{
    const tr=document.createElement('tr');
    if(resaltados.has(n.codigo)&&resaltados.size===1)tr.className='on';
    [n.codigo,n.titulo,n.autor].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});
    tb.appendChild(tr);
  });
  $('empty').hidden=lista.length>0;
  // árbol
  const caja=$('treeBox');
  if(!arbol.raiz){caja.innerHTML='<div class="empty">El árbol está vacío.</div>';return}
  const pos=new Map();let i=0,prof=0;
  const f=(n,d)=>{if(!n)return;f(n.izq,d+1);pos.set(n,{x:i++,d});prof=Math.max(prof,d);f(n.der,d+1)};
  f(arbol.raiz,0);
  const dx=54,dy=70,r=20,m=30,W=Math.max(i*dx+m*2,300),H=prof*dy+m*2+10;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const px=n=>m+pos.get(n).x*dx+dx/2-dx/2, py=n=>m+pos.get(n).d*dy;
  const g=document.createElementNS(NS,'g');svg.appendChild(g);
  const walk=n=>{
    if(!n)return;
    [n.izq,n.der].forEach(h=>{
      if(!h)return;
      const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',px(n));l.setAttribute('y1',py(n));l.setAttribute('x2',px(h));l.setAttribute('y2',py(h));
      l.setAttribute('class','edge'+(resaltados.has(n.codigo)&&resaltados.has(h.codigo)?' on':''));
      g.appendChild(l);walk(h);
    });
  };
  walk(arbol.raiz);
  pos.forEach((p,n)=>{
    const gr=document.createElementNS(NS,'g');
    gr.setAttribute('class','node'+(resaltados.has(n.codigo)?' on':''));
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',px(n));c.setAttribute('cy',py(n));c.setAttribute('r',r);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',px(n));t.setAttribute('y',py(n));t.textContent=n.codigo;
    const ti=document.createElementNS(NS,'title');ti.textContent=n.titulo+' — '+n.autor;
    gr.append(c,t,ti);g.appendChild(gr);
  });
  caja.innerHTML='';caja.appendChild(svg);
}

function limpiar(){['cod','tit','aut'].forEach(id=>$(id).value='')}

$('bAdd').onclick=()=>{
  const c=leerCodigo();if(c===null)return;
  const t=$('tit').value.trim(),a=$('aut').value.trim();
  if(!t||!a){msg('Ingresa el título y el autor.',true);return}
  if(arbol.insertar(c,t,a)){resaltados=new Set([c]);dibujar();msg(`Libro ${c} agregado correctamente.`);limpiar()}
  else msg('Ya existe un libro con ese código.',true);
};
$('bFind').onclick=()=>{
  const c=leerCodigo();if(c===null)return;
  const {nodo,ruta}=arbol.buscar(c);
  resaltados=new Set(ruta);
  if(nodo){
    $('tit').value=nodo.titulo;$('aut').value=nodo.autor;
    dibujar();msg(`Libro encontrado: ${nodo.titulo}. Comparaciones: ${ruta.length} (ruta ${ruta.join(' → ')}).`);
  }else{dibujar();msg(`No existe el código ${c}. Se hicieron ${ruta.length} comparaciones.`,true)}
};
$('bDel').onclick=()=>{
  const c=leerCodigo();if(c===null)return;
  if(arbol.eliminar(c)){resaltados=new Set();dibujar();msg(`Libro ${c} eliminado correctamente.`);limpiar()}
  else msg('No existe un libro con ese código.',true);
};
$('bClr').onclick=()=>{limpiar();resaltados=new Set();dibujar();msg('')};
$('bAll').onclick=()=>{resaltados=new Set();dibujar();msg(`Total de libros registrados: ${arbol.inorden().length}`)};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')$('bAdd').click()});

dibujar();
msg(`Total de libros registrados: ${arbol.inorden().length}`);
</script>
</body>
</html>
